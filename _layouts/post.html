---
layout: blog
---
<article>
  <header class="post-header">
    <h1>{{ page.title | escape }}</h1>
    <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%-d %B %Y' }}</time>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
{% include post-history.html %}
{% if page.mermaid %}
<script type="module" src="{{ '/assets/mermaid.js' | relative_url }}"></script>
{% endif %}
