<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101411" />
  <meta name="description" content="marcus1337 — software developer in Sweden. Games, tools, and small web experiments." />
  <title>marcus1337 — games, tools &amp; small worlds</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101411;
      --fg: #edf0e7;
      --muted: #a6afa5;
      --accent: #d4eea8;
      --line: #30392f;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }
    a { color: inherit; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    ::selection { background: var(--accent); color: var(--bg); }
    .shell { width: min(1240px, calc(100% - 96px)); margin: auto; }
    .site-header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 38px 0; }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 650; letter-spacing: -.5px; }
    .brand-mark { width: 20px; height: 20px; color: var(--accent); }
    .header-note, .eyebrow, .sketch-number, .footer-note {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    }
    .header-note { color: var(--muted); }
    main { min-height: calc(100svh - 210px); display: grid; align-items: center; padding: 38px 0 58px; }
    .hero { display: grid; grid-template-columns: 1.02fr 1fr; align-items: center; gap: 36px; }
    .eyebrow { display: flex; align-items: center; gap: 10px; color: var(--muted); margin: 0 0 24px; }
    .eyebrow::before { content: ""; width: 20px; height: 1px; background: var(--accent); }
    h1 { margin: 0; font-size: clamp(48px, 5.5vw, 76px); font-weight: 560; line-height: 1.06; letter-spacing: -.065em; }
    h1 span { color: var(--accent); }
    .intro { max-width: 390px; color: var(--muted); font-size: 16px; line-height: 1.8; margin: 28px 0 32px; }
    .links { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; }
    .link { display: inline-flex; align-items: center; justify-content: center; gap: 22px; min-height: 50px; padding: 0 22px; border: 1px solid var(--line); border-radius: 5px; font-size: 14px; font-weight: 600; text-decoration: none; transition: background .15s, border-color .15s; }
    .link-primary { background: var(--accent); color: #182014; border-color: var(--accent); }
    .link-primary:hover { background: #e1f7bd; border-color: #e1f7bd; }
    .link-secondary:hover { background: #20271f; border-color: #66735f; }
    .link svg { width: 16px; height: 16px; flex-shrink: 0; }
    .sketch { min-width: 0; margin: 0; padding-top: 6px; }
    .sketch-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; color: var(--muted); padding: 0 18px; }
    .sketch-title { margin: 0; font-size: 12px; font-weight: 450; }
    .sketch-number { font-size: 10px; color: #9da999; }
    .scene { display: block; width: 100%; height: auto; overflow: visible; }
    .scene .tile-shape { transition: transform .17s ease; }
    .scene .top-face { stroke: #111b15; stroke-width: 1.2; stroke-linejoin: round; transition: stroke .17s; }
    .scene.enhanced .tile { cursor: pointer; outline: none; }
    .tile-hidden { display: none; }
    .scene.enhanced .tile:hover .tile-shape, .scene.enhanced .tile:focus-visible .tile-shape { transform: translateY(-5px); }
    .scene.enhanced .tile:hover .top-face { stroke: #c4dfa2; }
    .scene.enhanced .tile:focus-visible .top-face { stroke: #fff; stroke-width: 3; }
    .sketch-caption { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 0 18px; margin-top: -12px; }
    .sketch-hint { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.7; }
    .controls { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .controls button { min-height: 44px; padding: 0 12px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: #c4cebd; font-size: 11px; cursor: pointer; }
    .controls button:hover { background: #222c21; border-color: #384735; color: var(--accent); }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .site-footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 25px 0 28px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .footer-note { font-size: 10px; letter-spacing: 1px; }
    @media (min-width: 1500px) { main { min-height: 690px; } }
    @media (max-width: 1000px) {
      .shell { width: calc(100% - 64px); }
      .hero { gap: 16px; }
      h1 { font-size: clamp(46px, 5.7vw, 64px); }
      .intro { font-size: 15px; }
      .sketch-caption { flex-wrap: wrap; gap: 4px; }
    }
    @media (max-width: 720px) {
      .shell { width: calc(100% - 40px); }
      .site-header { padding: 27px 0; }
      .header-note { font-size: 9px; letter-spacing: 1px; }
      main { min-height: 0; padding: 36px 0 40px; }
      .hero { grid-template-columns: 1fr; gap: 48px; }
      .eyebrow { font-size: 10px; margin-bottom: 20px; }
      h1 { font-size: clamp(44px, 9.4vw, 66px); }
      .intro { margin: 23px 0 26px; max-width: 380px; }
      .sketch { width: min(100%, 520px); justify-self: center; }
      .sketch-header, .sketch-caption { padding: 0 8px; }
      .sketch-caption { justify-content: space-between; }
      .site-footer { padding: 21px 0; }
    }
    @media (max-width: 380px) {
      .header-note { display: none; }
      .links { gap: 10px; }
      .link { padding: 0 16px; gap: 14px; font-size: 13px; }
      .footer-note { font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      document.getElementById('year').textContent = new Date().getFullYear();
      const scene = document.getElementById('sandbox');
      const tiles = [...scene.querySelectorAll('.tile')];
      const original = ['0000000', '0011000', '0122100', '0131210', '0012100', '0001000', '0000000'].join('').split('').map(Number);
      const palette = [
        { height: 0, top: '#28352d', left: '#202a24', right: '#19221d' },
        { height: 10, top: '#526949', left: '#354a32', right: '#293b28' },
        { height: 28, top: '#8bb574', left: '#526f43', right: '#3d5733' },
        { height: 48, top: '#d4eea8', left: '#8caf69', right: '#688849' }
      ];
      let world = [...original];
      let active = 24;
      let size = 7;
      const status = document.getElementById('sandbox-status');

      function drawTile(index) {
        const tile = tiles[index];
        const style = palette[world[index]];
        const h = style.height;
        const faces = [
          ['.left-face', `-32,${18-h} 0,${36-h} 0,36 -32,18`, style.left],
          ['.right-face', `0,${36-h} 32,${18-h} 32,18 0,36`, style.right],
          ['.top-face', `0,${-h} 32,${18-h} 0,${36-h} -32,${18-h}`, style.top]
        ];
        faces.forEach(([selector, points, fill]) => {
          const face = tile.querySelector(selector);
          face.setAttribute('points', points);
          face.setAttribute('fill', fill);
        });
        tile.setAttribute('aria-label', `Tile ${Number(tile.dataset.row)+1}, ${Number(tile.dataset.col)+1}: ${world[index] ? 'raised' : 'flat'}`);
        tile.setAttribute('aria-pressed', String(world[index] > 0));
      }

      // One tab stop for the entire sketch; arrow keys move within it.
      function select(index, focus = false) {
        tiles[active].setAttribute('tabindex', '-1');
        active = index;
        tiles[active].setAttribute('tabindex', '0');
        if (focus) tiles[active].focus({ preventScroll: true });
      }

      function toggle(index) {
        world[index] = world[index] ? 0 : 2;
        drawTile(index);
        status.textContent = `Tile ${Number(tiles[index].dataset.row)+1}, ${Number(tiles[index].dataset.col)+1} ${world[index] ? 'raised' : 'lowered'}.`;
      }

      tiles.forEach((tile, index) => {
        tile.setAttribute('role', 'button');
        tile.setAttribute('tabindex', index === active ? '0' : '-1');
        tile.setAttribute('aria-describedby', 'sandbox-help');
        tile.addEventListener('focus', () => select(index));
        tile.addEventListener('click', () => { select(index, true); toggle(index); });
        tile.addEventListener('keydown', (event) => {
          const row = Math.floor(index / 7);
          const col = index % 7;
          let next = index;
          if (event.key === 'ArrowUp') next = Math.max(0, row - 1) * 7 + col;
          else if (event.key === 'ArrowDown') next = Math.min(size - 1, row + 1) * 7 + col;
          else if (event.key === 'ArrowLeft') next = row * 7 + Math.max(0, col - 1);
          else if (event.key === 'ArrowRight') next = row * 7 + Math.min(size - 1, col + 1);
          else if (event.key === 'Home') next = 0;
          else if (event.key === 'End') next = (size - 1) * 7 + size - 1;
          else if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            if (!event.repeat) toggle(index);
            return;
          }
          else return;
          event.preventDefault();
          select(next, true);
        });
        drawTile(index);
      });

      document.getElementById('shuffle').addEventListener('click', () => {
        world = world.map((_, index) => {
          const row = Math.floor(index / 7), col = index % 7;
          if (row >= size || col >= size) return world[index];
          if (row === 0 || col === 0 || row === size - 1 || col === size - 1) return 0;
          const value = Math.random();
          return value < .45 ? 0 : value < .7 ? 1 : value < .93 ? 2 : 3;
        });
        tiles.forEach((_, index) => drawTile(index));
        status.textContent = 'New landscape created.';
      });
      document.getElementById('reset').addEventListener('click', () => {
        world = [...original];
        tiles.forEach((_, index) => drawTile(index));
        status.textContent = 'Original landscape restored.';
      });

      // A smaller scene gives phone users larger targets without zooming.
      const compact = window.matchMedia('(max-width: 720px)');
      function layout() {
        size = compact.matches ? 4 : 7;
        const hadTileFocus = document.activeElement.classList.contains('tile');
        tiles.forEach((tile) => {
          tile.classList.toggle('tile-hidden', Number(tile.dataset.row) >= size || Number(tile.dataset.col) >= size);
        });
        if (Math.floor(active / 7) >= size || active % 7 >= size) select(24, hadTileFocus);
        scene.setAttribute('viewBox', compact.matches ? '166 52 288 238' : '0 0 620 425');
        document.getElementById('grid-size').textContent = `${size} × ${size}`;
        document.getElementById('board-shadow').setAttribute('d', compact.matches ? 'm310 100 128 72-128 72-128-72Z' : 'm310 103 227 128-227 132L83 231Z');
        document.getElementById('scene-frame').setAttribute('d', compact.matches ? 'M184 72h-10v10 M436 72h10v10 M174 256v10h10 M446 256v10h-10' : 'M48 65H30v18 M572 65h18v18 M30 342v18h18 M590 342v18h-18');
      }
      layout();
      compact.addEventListener('change', layout);

      scene.setAttribute('role', 'group');
      scene.setAttribute('aria-label', 'Interactive isometric tile sketch');
      scene.classList.add('enhanced');
      document.getElementById('sketch-hint').textContent = 'Click or tap a tile. Make it your own.';
      document.getElementById('sketch-controls').hidden = false;
    })();
  </script>
