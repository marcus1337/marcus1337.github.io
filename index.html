<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>marcus1337</title>
  <meta name="description" content="Marcus — software developer. Links and projects." />
  <style>
    :root {
      --bg: #0b0c0f;
      --fg: #e9eefc;
      --muted: #aab3cf;
      --line: #24283a;
      --hover: #151923;
      --focus: #a7c8ff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --fg: #121424;
        --muted: #4c556e;
        --line: #e6e8f0;
        --hover: #f5f6fa;
        --focus: #385a99;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, Arial, sans-serif;
      display: grid;
      place-items: center;
    }
    main { width: min(720px, 92vw); padding: 28px 18px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 40px); letter-spacing: -.5px; }
    p { margin: 0 0 18px; color: var(--muted); line-height: 1.6; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: inherit;
      text-decoration: none;
      border: 1px solid var(--line);
      padding: 10px 14px;
      border-radius: 12px;
      transition: background-color .15s, border-color .15s;
    }
    a:hover {
      background: var(--hover);
      border-color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    a:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
    footer { margin-top: 18px; color: var(--muted); font-size: 13px; }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>marcus1337</h1>
    <p>Software developer in Sweden. I build games, tools and small web things.</p>
    <nav aria-label="Main links">
      <a href="https://marcus1337.github.io/about/">About</a>
      <a href="/blog/">Blog</a>
      <a href="https://github.com/marcus1337">GitHub</a>
    </nav>
    <footer>© <span id="y">2026</span></footer>
  </main>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
</body>
</html>
